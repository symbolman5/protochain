# ---- §11.4 旅程判据（真人 30 秒验证，pending 留痕模板）----
journey:
  status: pending_manual
  template: |
    ## §11.4 旅程留痕（真人执行后回填）
    执行人 / 日期 / 环境：
    打开方式：
      a) 浏览器端 viewer：http://localhost:8080/viewer/index.html
         → 拖拽 examples/anonymous-saas/web/data.json（增强数据）+ web/ 目录（项目级）
      b) 静态站点：node dist/cli/index.js derive-web -d examples/anonymous-saas（完整 build 后）
    验证点（30 秒内能指出）：
      1. 某条不变量（如 INV-1）由哪个组件的哪个接口守护？
         → 协议层交叉面板点 INV-1 → 操作行高亮 → 组件层查 interfaceImplementations
      2. 落在哪个存储？→ 维度→存储表（如 访问策略 → resources 表）
      3. 经什么通道传给谁？→ 组件→组件传输表 + 架构拓扑（control-plane→data-plane async）
      4. 点任意维度能看到引用它的全部 guard 与不变量
         → 协议层实体-维度卡片点维度 → guard 行 + 不变量列高亮
    结论：能指出 K / 4 项；失败项列出原因。

