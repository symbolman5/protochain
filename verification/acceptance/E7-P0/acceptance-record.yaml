item: E7-P0
date: 2026-08-22（v0.5 修复版）
executor: protochain E7 P0 自动化实现 + 独立复验 + v0.5 全量修复
instance: approval-flow（fixtures/approval-flow.md）+ saas-real-P4-push-node.md（大协议场景）
command: |
  # 1) 派生 specs（前置）
  protochain derive-specs --dir /tmp/e7p0-v05
  # 2) 派生 web 站点（带 VitePress build；本验证用 --no-build 跳过，离线无法下载 vitepress）
  protochain derive-web --dir /tmp/e7p0-v05 --no-build
  # 3) 静态服务（手写 dist/ 模拟 VitePress 产物；E7-I1 修复后默认 distDir = web/docs/.vitepress/dist）
  protochain web-serve --dir /tmp/e7p0-v05 --port 5176
  # 4) 畸形 URL 探针（E7-I3 修复后应 400 且 server 仍存活）
  curl http://127.0.0.1:5176/%zz  # → 400
  curl http://127.0.0.1:5176/      # → 200
result: pass
v0_5_fixes:
  - E7-I1（distDir 不一致）→ web-serve 默认改为 web/docs/.vitepress/dist
  - E7-I2（探针硬编码 IF_SYS_T1）→ 改为从 web/data.json 读真实接口 ID 构造；新增 --skip-probe
  - E7-I3（畸形 URL 进程崩溃）→ resolveStaticPath + handleRequest 双层 try/catch 兜底；畸形 → 400
  - E7-I4（死代码 basicPages）→ 删除；exit 改为 existsSync 5 类页面校验
  - E7-I5（占位恒真断言）→ 改为注入真实敏感键 tokenEnv/secretEnv 端到端断言
  - E7-I6（redact 行为与口径不符）→ 改为整键删除（非 [REDACTED] 替换）
  - E7-I7（missing vs corrupt 混淆）→ readOptionalJsonWithStatus 区分；warning 文案区分
  - E7-I8（--force no-op）→ deriveWeb 写产物前 existsSync 检查；未传 force → 抛"web 产物已存在；如需覆盖请传 --force"
