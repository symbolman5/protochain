build_baseline:
  tsc_errors: 0
  jest_suites: 58
  jest_cases: 833
  jest_v04_to_v05_delta: "+7 cases（E7-I2/I3/I5/I7/I8 修复测试）"
  cli_commands:
    - derive-web（新增，E7-P0）
    - web-serve（新增，E7-P0）

acceptance_checklist:
  derive_web_100_percent_mechanical:
    pass: true
    note: src/webgen/index.ts 不导入 ai/、不读 process.env、不读 bindings.yaml；纯机械映射 derived/*.json + model.md
  web_data_json_and_static_site_落盘:
    pass: true
    note: web/data.json 22 KB（含 12 接口 + 协议元数据 + 状态机图 + redactionNotice）+ web/docs/*.md 5 类页面 + web/docs/.vitepress/config.ts；exit 判定显式 existsSync 5 类页面（E7-I4 修复）
  protochain_web_serve_起服务:
    pass: true
    note: E7-I1 修复后默认 distDir 与 derive-web outDir 对齐（web/docs/.vitepress/dist）；web-serve 启动 + 6 URL 探针全 200
  四类页面人读_非裸_json:
    pass: true
    note: 接口详情用表格展示 requestSchema/responseSchema（5 字段+必填）；test-cases 用表格展示路径+状态+验证；verification 用 sideBySide 并排展示 legacy vs impl；diff 用表格展示 metadataChanges/derivableChanges + humanReadable 映射
  p0_无运行时依赖:
    pass: true
    note: package.json 未新增 vitepress 运行时依赖；web serve 用 stdlib http.createServer；MIME/path-traversal 拦截纯 ESM 实现；E7-I3 修复后畸形 URL 不崩进程（顶层 try/catch）
  安全_不接触_authConfig_token_等:
    pass: true
    note: SENSITIVE_FIELD_NAMES_REPORT 列出 11 类敏感字段名（tokenEnv/secretEnv/passwordEnv/keyEnv/usernameEnv/certPath/keyPath/caPath/token/secret/password/apiKey）；redactSensitiveFields 整键删除（E7-I6 修复）；CLI 报告与 web/data.json 顶部 redactionNotice 均显式声明；端到端测试注入真实敏感键 → 断言敏感值 + 敏感键名均不出现（E7-I5 修复）

scope_guards:
  no_runtime_dependencies:
    pass: true
    note: 仅 devDependency vitepress（站点工程内 web/package.json，独立维护）
  no_p1_features:
    pass: true
    note: 不实现 mock 服务 / 团队协作 / 环境管理 / Apifox 克隆 / 模型侧输入管理
  no_token_env_access:
    pass: true
    note: src/webgen/ 全模块不调用 process.env；web serve 进程不读 env
  no_authority_source_mutation:
    pass: true
    note: derive-web 是只读映射；不写 derived/* 任何文件；不写 model.md；E7-I8 修复后 --force 守卫生效

followup: 无（v0.5 全部 8 条 issues 已 resolved）

