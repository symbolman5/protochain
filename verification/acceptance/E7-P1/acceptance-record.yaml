item: E7-P1
date: 2026-08-23
executor: protochain E7-P1 v0.1 实现 + 验收阶段独立复验
instance: strangler-fig P1 + hsk-ng P1（多协议项目级）+ 单协议临时 dir
command: |
  # ===== 1) feedback-serve 启动 + env scrub（注入敏感 token 验证退出）=====
  LEGACY_TOKEN="E7P1-FINAL-DEMO-001-XYZ" ADMIN_TOKEN="E7P1-FINAL-DEMO-002-ABC" \
    node dist/cli/index.js feedback-serve --dir /work/hsk-ng/modeling --port 5220
  # → 启动成功；自动 scrub 6 个敏感 env 键；
  #   残留 scrubbedKeyNames 含 LEGACY_TOKEN/ADMIN_TOKEN/SERVER_TOKENFILE/CFS_TOKEN 等；
  #   remainingSensitiveEnvKeys=[]；
  #   tokenEnvAbsent=true；OS 层残留（osProcResidualKeys）透明披露。
  # 详见 startup-log.txt + api-health-snapshot.txt

  # ===== 2) 在线编辑 scenarios（端到端）=====
  curl -X PUT http://127.0.0.1:5220/api/scenarios/sc-e2e-test.yaml \
    -H "content-type: application/json" \
    -d '{"id":"SC-P1-E2E","expectedActions":["register"],"params":{"username":"acceptance"}}'
  # → 落盘成功：/work/hsk-ng/modeling/protocol/P1/scenarios/sc-e2e-test.yaml
  #   文件内容包含合法 expectedActions/params，符合 SCENARIO_SCHEMA（ajv 校验）

  # GET 读回
  curl http://127.0.0.1:5220/api/scenarios/sc-e2e-test.yaml
  # → 200 + raw + parsed（含 expectedActions=["register"]）

  # DELETE 清理（不留残留在实例）
  curl -X DELETE http://127.0.0.1:5220/api/scenarios/sc-e2e-test.yaml
  # → 200，文件已删

  # ===== 3) 一键 generate-cases（机械推导 → 产物差异）=====
  # 端到端：编辑 scenarios/*.yaml → 一键 generate-cases → 产物 derived/test-cases.json 变化
  sha256sum /work/hsk-ng/modeling/protocol/P1/derived/test-cases.json   # BEFORE
  curl -X POST http://127.0.0.1:5220/api/run/generate-cases \
    -H "content-type: application/json" \
    -d '{"args":["--protocol","P1"]}'
  sha256sum /work/hsk-ng/modeling/protocol/P1/derived/test-cases.json   # AFTER
  # → BEFORE != AFTER；详见 api-run-generate-cases-tc-diff.txt

  # ===== 4) 一键 verify（无 impl：dev 环境；模拟子进程可达）=====
  curl -X POST http://127.0.0.1:5220/api/run/verify \
    -H "content-type: application/json" \
    -d '{"args":["--protocol","P1"]}'
  # → 工具链协议规定的 "环境变量缺失 LEGACY_TOKEN" 提示出现；子进程 stdout/stderr
  #   中 E7P1-FINAL-DEMO-XXX 出现 0 次（env 隔离硬约束）；
  #   详见 api-run-verify.txt + secret-leak-scan.txt

  # ===== 5) 评审 → 修改单草稿（修改单机制走通）=====
  curl -X POST http://127.0.0.1:5220/api/issues \
    -H "content-type: application/json" \
    -d '{
      "target":"model",
      "elementId":"INV_PS1",
      "category":"bug",
      "severity":"P1-7d",
      "title":"feedback-serve E7P1 端到端验收",
      "body":"E7-P1 验收 trace ...",
      "author":"E7P1-e2e-acceptance-v3",
      "impact":"仅记录",
      "suggestion":"无"
    }'
  # → 落盘 /work/工具链修改单-007-protochain-feedback-serve-e7p1.md（status=待审阅）；
  #   走通 M→D→B→I→V→R 流程；详见 draft-issue-sample.md

  # ===== 6) 进程 env 隔离（服务 /api/health 全程报告无敏感键）=====
  curl http://127.0.0.1:5220/api/health
  # → remainingSensitiveEnvKeys: []；
  #   scrubbedKeyNames 含 LEGACY_TOKEN/ADMIN_TOKEN 等被 scrub 的键名（值已 redact）；
  #   tokenEnvAbsent: true；
  #   osProcResidualKeys: [...] (Linux 内核 /proc/<pid>/environ 残留，
  #   不影响子进程 env；透明披露；详见 api-health-snapshot.txt)

result: pass

