    - verification/acceptance/E7-P1/api-health-snapshot.json
        raw JSON 同上
    - verification/acceptance/E7-P1/static-pages-probe.txt
        7 个静态资源（/, /scenarios, /bindings, /run, /review, /assets/app.js, /assets/app.css）HTTP 200
    - verification/acceptance/E7-P1/api-scenarios-list-snapshot.txt
