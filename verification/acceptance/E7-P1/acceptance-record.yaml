  tsc_errors: 0
  jest_suites: 70
  jest_cases: 1027
  delta_from_e7_b1: "T1/T2 基线 64/933；本任务增量 +6 suites (feedback-env-guard, schemas, store, issues, server, runner) / +94 cases"

issues_resolution:
  E7-P1-I1 (resolved): bind/expr cmd-line 区分 --no-ai 不支持的子命令 — verify --protocol P1 不传 --no-ai 时直接 exit=0；bindings PUT 后能立即生效
  E7-P1-I2 (resolved): bindings PUT 全量覆盖无 merge — 端到端发现后已建议 (v0.2 followup)：通过 P004 修改单草稿（/work/工具链修改单-004-protochain-p1-bindings-overwrite.md）记录 bug + 修复路径

scope_guards:
  p0_promise_preserved:
    pass: true
    note: P0 derive-web 静态站点（src/webgen/index.ts、src/webgen/serve.ts）未改；停掉 P1 服务后 P0 产物仍可独立托管；redactSensitiveFields 实现继续走整键删除路径（与 P0 一致）
  p0_derived_unmutated:
    pass: true
    note: P1 不直接写 derived/ 产物；编辑落权威源（scenarios/*.yaml + bindings.yaml）；变化经 generate-cases/bind/verify 机械命令重推导
  schema_validation_required:
    pass: true
    note: SCENARIO_SCHEMA（id 必以 SC- 开头 + expectedActions 非空）+ BINDING_FILE_SCHEMA（roles+interfaces required）；非法 body 拒绝落盘（如 PUT 缺 interfaces 返 400 + 报错信息）
  no_token_in_service_process:
    pass: true
    note: scrunProcessEnv 删除 process.env 中所有 TOKEN/SECRET/PASSWORD/APIKEY 键；服务进程从启动起不持有；/api/health 报告 remainingSensitiveEnvKeys=[]；tokenEnvAbsent=true
  no_token_in_child_process:
    pass: true
    note: filterEnvForChild 白名单 + 显式 override；同时兜底清敏感键；子进程 stdout/stderr 含已知 secret 字符串次数 = 0（secret-leak-scan.txt）
  response_redact:
    pass: true
    note: 所有 ok() 响应序列化前走 redactSensitiveFields（SENSITIVE_FIELD_NAMES 含 tokenEnv/secretEnv/passwordEnv/certPath/keyPath 等）；ok(res, ...) helpers 集中处置
  os_layer_disclosure:
    pass: "documented (limitation)"
    note: Linux 内核 mm_struct 拷贝父进程 environ；scrubProcessEnv 仅删 process.env（Node.js 单进程无法主动清 /proc/<pid>/environ）；本任务加 osProcResidualKeys 透明披露字段；建议 v0.2 followup 用 prctl(PR_SET_DUMPABLE,0) + setrlimit RLIMIT_CORE=0 进一步缓解（同 uid 也无法读）

acceptance_checklist:
  scenarios_online_edit:
    pass: true
    note: "PUT /api/scenarios/:filename 落权威源；非法 body 拒绝（ajv）；DELETE 删除；list 列出"
  bindings_online_edit:
    pass: true
    note: "PUT /api/bindings 接受 _rawYAML 字符串（服务端 yaml 解析 + ajv 校验）；合法落盘，非法拒绝（缺 interfaces 时返 must have required property 'interfaces'）"
  one_click_generate_cases:
    pass: true
    note: "POST /api/run/generate-cases → spawnSync node dist/cli/index.js generate-cases --dir ... --protocol P1；child env 隔离（filterEnvForChild）；test-cases.json sha256 BEFORE != AFTER（DIFFERENT → 机械命令产生用例变化）"
  one_click_verify:
    pass: true
    note: "POST /api/run/verify → 子进程 env 不含服务进程 scrub 掉的 TOKEN 字符；输出中已知 secret 字符串 0 次；dev 环境下工具链正常返回 [verify] 环境变量缺失提示"
  review_to_draft_issue:
    pass: true
    note: "POST /api/issues → 走 M→D→B→I→V→R 模板流程（先审阅）落到 /work/工具链修改单-NNN-protochain-<slug>.md；落盘内容含评审对象/严重度/现象/影响/建议/验收/审阅记录；草稿不直接注入 model.md/specs.json"
  no_sensitive_field_in_response:
    pass: true
    note: "/api/scenarios 与 /api/bindings 与 /api/issues 全部走 redactSensitiveFields；键名 tokenEnv/secretEnv/passwordEnv/certPath 等整键删除，不输出"
  no_token_env_in_service:
    pass: true
    note: "scrubProcessEnv() 在 buildApp 内同步执行；/api/health 报告 remainingSensitiveEnvKeys=[]；tokenEnvAbsent=true"
  no_token_in_child_process:
    pass: true
    note: "secret-leak-scan.txt：E7P1-FINAL-DEMO-001-XYZ / E7P1-FINAL-DEMO-002-ABC 等在子进程 stdout/stderr 出现次数 = 0"
  model_browser_e2e:
    pass: true
    note: "hsk-ng P1 + strangler-fig P1 端到端跑通：编辑 → 一键 → verify；test-cases.json 产物落盘变化"
  static_pages:
    pass: true
    note: "/, /scenarios, /bindings, /run, /review, /assets/app.js, /assets/app.css 均 HTTP 200"

followup:
  - E7-P1-1 (medium / open): PUT /api/bindings 全量覆盖无 merge — 已记录为 P004 修改单草稿（004-protochain-p1-bindings-overwrite.md）；建议 v0.2 落地 PATCH 接口 + .bak 自动备份 + atomic write
  - E7-P1-2 (low / open): Linux /proc/<pid>/environ OS 层残留透明披露；建议 v0.2 跟进 prctl(PR_SET_DUMPABLE,0)
  - E7-P1-3 (low / documented): detectCliPath 在 dist ESM 模式下用 process.argv[1] + 上溯扫描，无需 import.meta.url；CJS (ts-jest) 走 __dirname；与 E5-I1 同源 import.meta 限制未被 E7-P1 解决（本任务彻底避免了）
  - E7-P1-4 (low / open): SCENARIO_SCHEMA.id pattern 'SC-' 过于严格；hsk-ng 现有 sc-01.yaml 用 'SC-01' 通过；strangler-fig 用 'SC-P1-01' 也通过；理论上单实例内部 id 命名应放开——但 P1 编辑器为审阅一致性保留严格前缀

