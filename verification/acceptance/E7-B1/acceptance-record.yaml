    - src/composition-parser/index.ts（v0.2：changeType 接受 protocol_extend；新增 preprocessYamlProse）
    - src/parser/extension-sections.ts（v0.2：parseSubItemsByHeading 增加 yamlPreprocessor 可选参数）
    - src/model/types.ts（v0.2：CompositionMetadata.changeType 枚举扩展）
    - src/cli/index.ts（v0.2：web-serve 按 schemaVersion 自动分支 + --skip-probe 传空数组 + 探针消息动态化）
  tests:
    - tests/webgen/composition.test.ts（60 cases，含 B1-I1/I3 新增/修正）
    - tests/webgen/webgen.test.ts（v0.2 新增 B1-I3 probePaths=[] × 1）
    - tests/composition-parser/composition-parser.test.ts（v0.2 新增 B1-I2 × 6 cases）
  evidence:
    - verification/acceptance/E7-B1/E7-B1-COMPLETE.txt
    - verification/acceptance/E7-B1/derive-web-cli-output-v02.txt（hsk-ng 真实根）
    - verification/acceptance/E7-B1/webserve-cli-output-v02.txt（组合层 8 探针全 200）
    - verification/acceptance/E7-B1/webserve-skipprobe-output-v02.txt
    - verification/acceptance/E7-B1/web-data-snapshot-v02.json（含 crossInvariants 8 条）
    - verification/acceptance/E7-B1/{project,cross-refs,cross-diff,protocols-index,protocols-P1,protocols-P3}-md-snapshot-v02.txt
    - verification/acceptance/E7-B1/tsc-noEmit-output-v02.txt
    - verification/acceptance/E7-B1/jest-output-v02.txt

