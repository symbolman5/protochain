item: E7-B1
date: 2026-08-22（v0.2：B1-I1/I2/I3 全量修复；v0.1 初次实施）
executor: protochain E7-B1 v0.1 自动化实现 + 独立复验 + v0.2 全量修复
instance: hskNG 真实根（/work/hsk-ng/modeling，非裁剪 fixture）
command: |
  # 1) hskNG 真实根走组合层模式（B1-I2 修复后端到端跑通）
  rm -rf /work/hsk-ng/modeling/web
  node dist/cli/index.js derive-web --dir /work/hsk-ng/modeling --project --no-build --force
  # 2) 组合层产物 web-serve 探针（B1-I3 修复后 8 探针全 200）
  #    注：CI 离线无法下载 vitepress，手写 dist 模拟（脚本见附录）
  node dist/cli/index.js web-serve --dir /work/hsk-ng/modeling --port 5181
  # 3) --skip-probe 实际生效（B1-I3 修复）
  node dist/cli/index.js web-serve --dir /work/hsk-ng/modeling --port 5182 --skip-probe
  # 4) 单协议回归（无回归）
  # 5) 单元测试（59 suites / 899 cases 全过）
  npx jest
  # 6) tsc 静态检查
  npx tsc --noEmit
result: pass

