# =============================================================================
# D4 守卫谓词体受限填充
# 判据：命中（json-schema/受限谓词）生成校验调用，未命中显式标注待填且 schemaDegradedReasons 有记录
# =============================================================================
D4:
  verdict: pass
  per_model:
    food-delivery: |
      5 个 guard → 命中 2（T5/T5b：rider_available && rider_in_flight_orders < 10 → json-schema
      preconditions，ajv 可编译 2/2，校验调用可生成）；未命中 3（T3/T8/T9 单标识符 → legacy-stub
      显式标注 + schemaDegradedReasons 3 条记录）。specs 层 hitRate=0.4；X6 反例 5 条 R4 差额
      显式降级记录（不静默）。
    P1: |
      4 个 guard → 命中 2（T1 nonEmpty(order_id)、T3 fulfillment_qty == order_qty 受限谓词：
      在 IR 层由 checker X17 / casegen X6 命中，生成可执行反例 X6_T1_c0 / X6_T3_c0）；
      未命中 2（T2/T4 自然语言 → legacy-stub + schemaDegradedReasons 2 条记录）。X6 差额 4 条显式。
    P2: |
      4 个 guard → 命中 2（T1 nonNegative(amount)、T4 nonEmpty(refund_reason) 受限谓词：
      X6 反例生成）；未命中 2（T2/T3 自然语言 → legacy-stub + schemaDegradedReasons 2 条记录）。
  observation_O2: |
    E2.1 设计行为：接口契约层提供 requestSchema 时（P1 T1/T3、P2 T1/T4），guard 不回填 specs
    preconditions（specifier 注释：「提供契约 schema 时契约层是权威，guard 不再被回填」），
    受限谓词 guard 在 specs.json 层既无 json-schema precondition 也无降级记录（静默跳过）；
    但 checker X17（IR 层 resolveTransitionPreconditions 直读 t.guard）与 casegen X6（直读 IR）
    均命中并生成反例，guard 未丢失。记录为观察项，建议后续让 derive-specs 对受限谓词 guard
    显式投影 json-schema precondition（或显式降级记录），消除 specs 层盲区。
  conclusion: |
    命中者生成校验调用（json-schema 可编译 schema / X6 可执行反例）；未命中者全部显式标注
    legacy-stub 且 schemaDegradedReasons 有记录（food 3 + P1 2 + P2 2 = 7 条，逐条可查）。

