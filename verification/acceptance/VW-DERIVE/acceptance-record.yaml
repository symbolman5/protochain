# D5 用例→测试代码确定性翻译，产物可直接执行（R12）
# 判据：用例 → 测试代码为确定性翻译，产物可直接执行
# =============================================================================
D5:
  verdict: pass
  determinism:
    generate-cases: |
      同输入两次运行（--no-ai，确定性路径）：
      food-delivery / P1 / P2 三份 test-cases.json 去掉 generatedAt 时间戳后逐字节一致
      （normalized-identical=true；两次产物字节数相同），确定性成立。
    generate-tests: |
      food-delivery 同副本两次运行：test-tool 5 文件（protocol-model/scenario-loader/
      protocol-executor/consistency-asserter + meta.json）去掉时间戳/来源路径后完全一致。
  executability:
    test_tool_compile: "3 份生成的 derived/test-tool/*.ts 独立 tsc 编译 0 errors（module=nodenext）"
    test_tool_run_e2e: |
      node dist/cli/index.js test-tool run -d <P1副本> --impl <最小实现> --limit 1
      → test-tool 消费：executed=1 passed=1 failed=0，exit 0，产出 VerificationReport。
      （impl 由真人填充谓词体 —— 即 J3 旅程的落地实现。）
    adversarial_body: |
      X6 对抗用例 body 为可执行 jest 代码（import @jest/globals + <testtool>/mock，
      真实断言 expect(res.failed).toBe(true) / expect(snapshot()).toEqual(before)，
      文件头部含 R5 冻结边界声明 jest.useFakeTimers + schedulerMock.disable），非空壳。
    existing_chain: |
      R12 承接确认：tests/testtool/testtool-runner.test.ts（PASS）覆盖
      generate-tests→test-tool 加载可执行 + generate-cases→test-cases.json 逐条执行 +
      失败可见 + 契约不满足不可静默回退 —— 确定性翻译链已由既有测试承接。
  conclusion: |
    用例→测试代码为确定性翻译（同输入两次产物逐字节一致，仅时间戳/路径元数据不同）；
    产物可直接执行（tsc 编译通过 + test-tool run 端到端跑通 + 对抗用例 body 可执行）。

# =============================================================================
# J3 旅程判据留痕模板（真人补完谓词体后验证生成骨架无需改动即通过全部用例）
# =============================================================================
journey_j3:
  status: pending_manual
  note: >
    J3 为旅程判据（真人补完谓词体的落地实现后，生成的骨架无需改动即可通过全部生成的用例）。
    本步只准备留痕模板与执行指引；真人执行由主会话协调，执行后按下模板回填。
  template: |
    ## J3 旅程留痕（真人执行后回填）
    执行人 / 日期 / 环境：
    1. 前置（三实例各一遍）：
       node dist/cli/index.js generate-cases  --no-ai -d examples/food-delivery
       node dist/cli/index.js generate-cases  --no-ai -d examples/fulfillment-payment --protocol P1
       node dist/cli/index.js generate-cases  --no-ai -d examples/fulfillment-payment --protocol P2
       node dist/cli/index.js generate-tests  -d <实例>（--protocol Pn）
       node dist/cli/index.js generate-scaffold -d <实例> --lang=ts
       node dist/cli/index.js derive-bindings -d <实例>（--protocol Pn）
       node dist/cli/index.js derive-storage  -d <实例>（--protocol Pn）
    2. 真人补谓词体：在 impl 模块中实现全部接口（含命中的受限谓词校验调用
       json-schema preconditions 与 X6 反例要求的「合取项不满足 ⇒ 调用失败」语义），
       未命中的 legacy-stub 谓词（自然语言 / 单标识符）按模型语义手工实现（即「待填」处）。
    3. 执行全部生成用例：
       node dist/cli/index.js test-tool run -d <实例> --impl <实现模块> --out <report.json>
       （以及 X6 对抗用例 —— 将 test-cases.json adversarialCases[].body 落为 jest 用例后
        npx jest 执行）
    4. 逐条回填：
       - 用例 ID / 期望 vs 实际：
       - 是否失败 / 失败信息：
       - 失败是否源于「生成骨架与实现不匹配」（若是 → 生成骨架需改动，J3 失败）：
       - 若失败源于谓词体实现错误（真人填充的 bug）→ 修正实现后重跑直至通过（J3 通过）：
    5. 汇总：生成骨架改动次数 = K（期望 0）；全部用例通过 = N/M。
       结论：生成骨架无需改动即通过全部生成用例（K=0）＝通过 / 否则列出需改动项。
    6. 附件：执行输出文件路径（归档至 verification/acceptance/VW-DERIVE/）。

