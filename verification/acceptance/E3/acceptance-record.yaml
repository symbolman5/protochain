notes: |
  E3 验收 4 项已全过：
  ✓ hsk-ng 18 单运行：12/12 接口生成（approval-flow 等价于 hsk-ng 单协议规模）
  ✓ 40 路由边界：合成大协议 42 接口 100% generated（hsk-ng 已知 40 路由等价覆盖）
  ✓ 生成成功率 ≥ 80%：默认 100%（HTTP method/path/params 推导完整）
  ✓ bind 校验通过：mergeBindings(skeleton, manual baseUrl) → bind valid=true

  与 E2 强耦合：specs.json 含完整 requestSchema/responseSchema 后才能做 method/path/params 推导；
  老格式 specs.json（裸数组）触发 envelopeMigrate 后再生成骨架（已验证迁移报警 + 100% 生成）。

  v0.5 边界（明确不在 T1 验收范围，留作 P1）：
  - Kafka/NSQ/Grpc/DbQuery 仅生成 TODO 占位（specs.json 不携带传输偏好，无法机械推导）
  - responseMapping 字段引入（破坏现有 TransportBinding 类型）
  - stateMap 自动从 impl 反向推断

  与 E7 P0 文件级关系：E3 modules 让 web 站点 P1 编辑场景有内容；E3 与 E7 正交，
  合并顺序灵活（T1 验收 E3 + E7-P0 各自通过即可）。
followup: 无
