  7. 抽查 method/path/params 推导：submit → POST /submit + currentState 进 body（正确）
  8. 抽查 observation 接口：observe_草稿 → GET /observe_草稿 + 空 params（正确）
  9. 抽查 roleId 选择：approval-flow 取首个角色 applicant（consensus 未设）
  10. 抽查 stateMap 派生：5 个 state observation 接口 → 5 条 stateMap 条目
