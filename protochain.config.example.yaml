# protochain 项目配置模板
#
# 用法：复制为 protochain.config.yaml 并按需修改。
#   cp protochain.config.example.yaml protochain.config.yaml
#
# 安全提示：
# - protochain.config.yaml 已被 .gitignore 忽略（含明文 API key，勿入库）；
# - apiKey 可省略：留空时按 provider 自动读取对应环境变量：
#     openai → OPENAI_API_KEY / anthropic → ANTHROPIC_API_KEY / deepseek → DEEPSEEK_API_KEY

name: 协议名称

ai:
  provider: deepseek            # openai | anthropic | deepseek | local
  apiKey: ${DEEPSEEK_API_KEY}   # 可省略，留空走环境变量；local 无需此项
  model: deepseek-v4-flash
  baseUrl: https://api.deepseek.com

# 形式化工具（formalize 步骤；省略则降级 AI 推演）
formalTool: tla
tlc:
  javaPath: /path/to/jre
  tla2toolsJar: /path/to/tla2tools.jar
  timeoutMs: 120000

# 路径（一般无需改动）
paths:
  protocol: protocol/
  derived: derived/
  scaffold: impl-scaffold/
